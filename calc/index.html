<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор стоимости</title>
<style>
  :root { --accent:#2f6fed; --ink:#14171f; --muted:#646b7a; --line:#e3e6ec; --bg:#f5f6f9; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  #calc { max-width:1040px; margin:0 auto; padding:28px 20px 48px; }
  .bar { display:flex; align-items:center; justify-content:space-between; max-width:1040px; margin:0 auto; padding:16px 20px 0; }
  .back { color:var(--muted); text-decoration:none; font-size:14px; } .back:hover { color:var(--ink); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:24px; }
  .tab { border:1px solid var(--line); background:var(--card); padding:8px 16px; border-radius:999px; font:inherit; font-size:14px; cursor:pointer; color:var(--muted); }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .head h1 { font-size:clamp(24px,4vw,36px); line-height:1.15; margin:0 0 8px; letter-spacing:-.02em; }
  .head p { margin:0 0 28px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:1fr 360px; gap:24px; align-items:start; }
  .fields { background:var(--card); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:24px; }
  .field label, .lbl { display:block; font-weight:600; margin-bottom:10px; }
  .num { display:flex; align-items:center; gap:16px; }
  .num input[type=range] { flex:1; accent-color:var(--accent); height:28px; }
  .num-box { display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .num-box input { width:56px; border:0; text-align:end; font:inherit; font-weight:600; padding:8px 2px; -moz-appearance:textfield; }
  .num-box input::-webkit-inner-spin-button { -webkit-appearance:none; }
  .unit { padding:0 8px 0 4px; color:var(--muted); font-size:14px; }
  .step { border:0; background:var(--bg); width:36px; height:40px; font-size:18px; cursor:pointer; color:var(--ink); }
  .step:hover { background:var(--line); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1.5px solid var(--line); background:var(--card); padding:10px 14px; border-radius:10px; font:inherit; font-size:15px; cursor:pointer; color:var(--ink); }
  .chip.on { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 9%, white); color:var(--accent); font-weight:600; }
  .checks { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check { display:flex; align-items:center; gap:10px; padding:12px; border:1.5px solid var(--line); border-radius:10px; cursor:pointer; font-size:15px; }
  .check input { position:absolute; opacity:0; }
  .box { width:20px; height:20px; border:1.5px solid #c4c9d4; border-radius:6px; flex:none; display:grid; place-items:center; }
  .check input:checked + .box { background:var(--accent); border-color:var(--accent); }
  .check input:checked + .box::after { content:""; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:translateY(-1px) rotate(45deg); }
  .check:has(input:checked) { border-color:var(--accent); }
  .check input:focus-visible + .box, .chip:focus-visible, .tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .side { position:sticky; top:20px; display:flex; flex-direction:column; gap:12px; }
  .total-card { background:var(--ink); color:#fff; border-radius:16px; padding:22px 24px; }
  .t-lbl { font-size:14px; opacity:.7; }
  .total { font-size:40px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin:4px 0 8px; }
  .note { margin:0; font-size:13px; opacity:.65; }
  .lead { background:var(--card); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .lead input { font:inherit; padding:13px 14px; border:1.5px solid var(--line); border-radius:10px; }
  .lead input:focus { outline:none; border-color:var(--accent); }
  .hp { position:absolute; left:-9999px; }
  .cta { font:inherit; font-weight:600; padding:15px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  .cta:hover { filter:brightness(1.07); } .cta:disabled { opacity:.6; cursor:wait; }
  .msg { margin:0; font-size:14px; color:var(--muted); min-height:1em; } .msg.err { color:#d33; }
  .done { text-align:center; padding:12px 4px; } .done p { margin:6px 0 0; color:var(--muted); font-size:14px; }
  .ok { width:48px; height:48px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:24px; margin:0 auto 10px; }
  .demo { font-style:italic; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } .side { position:static; } .checks { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../" data-i18n="back">Portfolio</a>
  <button id="lang" type="button">EN</button>
</header>
<div id="calc"></div>
<script>
  // Настройки под клиента:
  window.CALC_SETTINGS = {
    preset: "ceilings", // ceilings | windows | cleaning | repair (или свой пресет)
    currency: "",       // пусто = по языку (RU → RUB, UA → UAH, остальные → USD). Для клиента можно жёстко: "UAH"
    endpoint: "",       // URL воркера из папки worker/. Пусто = демо, заявка не отправляется
    demo: true          // true = показывать переключатель ниш (для портфолио). У клиента: false
  };
</script>
<script src="i18n.js"></script>
<script src="../lang.js"></script>
<script src="presets.js"></script>
<script src="calc.js"></script>
</body>
</html>
