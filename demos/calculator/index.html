<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEMO — Renovation calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;color:#1d2a2a;background:#f2f6f5}
.bar{background:#ffe9a8;text-align:center;padding:8px;font-size:14px}.bar a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px}
.box{background:#fff;border-radius:14px;padding:20px;border:1px solid #d7e2e0;display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:600}
input,select{font:inherit;padding:10px;border:1px solid #b9cbc8;border-radius:8px;font-weight:400}
.ck{display:flex;gap:8px;font-weight:400}
.total{font-size:34px;font-weight:700;color:#0f6b5c}
#lang{float:right;border:1px solid;background:none;border-radius:6px;padding:3px 9px;cursor:pointer}
</style>
</head>
<body>
<div class="bar"><span data-ru="Demo project from Yakov's portfolio. Prices are illustrative." data-en="Demo project from Yakov's portfolio. Prices are illustrative."></span> <a href="../../" data-ru="← back to portfolio" data-en="← back to portfolio"></a></div>
<div class="wrap">
  <button id="lang">EN</button>
  <h1 data-ru="How much is a renovation?" data-en="How much is a renovation?"></h1>
  <div class="box" id="calc">
    <label><span data-ru="Area, m²" data-en="Area, m²"></span><input id="area" type="number" min="1" max="1000" value="40"></label>
    <label><span data-ru="Renovation type" data-en="Renovation type"></span>
      <select id="type"><option value="35">Cosmetic</option><option value="70" selected>Full</option><option value="120">Designer</option></select></label>
    <label class="ck"><input type="checkbox" id="demo"><span data-ru="Demolition (+$8/m²)" data-en="Demolition (+$8/m²)"></span></label>
    <label class="ck"><input type="checkbox" id="mat"><span data-ru="Materials purchase (+15%)" data-en="Materials purchase (+15%)"></span></label>
    <div><span data-ru="Estimate:" data-en="Estimate:"></span><div class="total" id="total"></div><span id="days"></span></div>
  </div>
</div>
<script src="../../lang.js"></script>
<script>
function calc() {
  var a = Math.min(1000, Math.max(0, +document.getElementById('area').value || 0));
  var sum = a * +document.getElementById('type').value;
  if (document.getElementById('demo').checked) sum += a * 8;
  if (document.getElementById('mat').checked) sum *= 1.15;
  var days = Math.max(3, Math.ceil(a / 4));
  document.getElementById('total').textContent = '$' + Math.round(sum).toLocaleString('en-US');
  document.getElementById('days').textContent = currentLang() === 'ru' ? 'Timeline: ~' + days + ' days' : 'Timeline: ~' + days + ' days';
}
document.getElementById('calc').addEventListener('input', calc);
document.addEventListener('langchange', calc);
calc();
</script>
</body>
</html>
