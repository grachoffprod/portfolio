<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-ru="DEMO — Калькулятор ремонта" data-en="DEMO — Renovation calculator">DEMO — Renovation calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;color:#f2f3f5;background:#090b10}
.bar{background:#ffe58a;color:#171207;text-align:center;padding:8px;font-size:14px;font-weight:700}.bar a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px}
.box{background:#12151c;border-radius:14px;padding:20px;border:1px solid #2b313c;display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:600}
input,select{font:inherit;padding:10px;border:1px solid #555e6c;border-radius:8px;font-weight:400;background:#090b10;color:#f2f3f5}
.ck{display:flex;gap:8px;font-weight:400}
.ck input{accent-color:#a3ffbf}
.total{font-size:34px;font-weight:700;color:#a3ffbf}
#lang{float:right;border:1px solid #555e6c;color:#f2f3f5;background:#12151c;border-radius:6px;padding:3px 9px;cursor:pointer}
:focus-visible{outline:2px solid #a3ffbf;outline-offset:3px}
</style>
</head>
<body>
<div class="bar"><span data-ru="Демонстрационный проект из портфолио Yakov. Цены условные." data-en="Demo project from Yakov's portfolio. Prices are illustrative."></span> <a href="../../" data-ru="← к портфолио" data-en="← back to portfolio"></a></div>
<div class="wrap">
  <button id="lang">RU</button>
  <h1 data-ru="Сколько стоит ремонт?" data-en="How much is a renovation?"></h1>
  <div class="box" id="calc">
    <label><span data-ru="Площадь, м²" data-en="Area, m²"></span><input id="area" type="number" min="1" max="1000" value="40"></label>
    <label><span data-ru="Тип ремонта" data-en="Renovation type"></span>
      <select id="type"><option value="35" data-ru="Косметический" data-en="Cosmetic">Cosmetic</option><option value="70" selected data-ru="Капитальный" data-en="Full">Full</option><option value="120" data-ru="Дизайнерский" data-en="Designer">Designer</option></select></label>
    <label class="ck"><input type="checkbox" id="demo"><span data-ru="Демонтаж (+$8/м²)" data-en="Demolition (+$8/m²)"></span></label>
    <label class="ck"><input type="checkbox" id="mat"><span data-ru="Закупка материалов (+15%)" data-en="Materials purchase (+15%)"></span></label>
    <div><span data-ru="Ориентировочно:" data-en="Estimate:"></span><div class="total" id="total"></div><span id="days"></span></div>
  </div>
</div>
<script src="../../lang.js"></script>
<script>
function calc() {
  var a = Math.min(1000, Math.max(0, +document.getElementById('area').value || 0));
  var sum = a * +document.getElementById('type').value;
  if (document.getElementById('demo').checked) sum += a * 8;
  if (document.getElementById('mat').checked) sum *= 1.15;
  var days = Math.max(3, Math.ceil(a / 4));
  document.getElementById('total').textContent = '$' + Math.round(sum).toLocaleString('en-US');
  document.getElementById('days').textContent = currentLang() === 'ru' ? 'Срок: ~' + days + ' дн.' : 'Timeline: ~' + days + ' days';
}
document.getElementById('calc').addEventListener('input', calc);
document.addEventListener('langchange', calc);
calc();
</script>
</body>
</html>
