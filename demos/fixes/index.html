<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-ru="ДЕМО — Правки сайта" data-en="DEMO — Website fixes">DEMO — Website fixes</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font:16px/1.55 system-ui,sans-serif}.bar{padding:10px 16px;background:#fff;color:#080808;text-align:center;font-weight:700}.bar a{color:inherit}.wrap{max-width:760px;margin:auto;padding:24px 20px}#lang{float:right;background:#151515;border:1px solid #777;color:#fff;border-radius:6px;padding:5px 10px}h1{font-size:clamp(30px,6vw,48px);line-height:1.1}.compare{--split:52%;position:relative;height:230px;display:flex;overflow:hidden;border:1px solid #777;border-radius:12px;background:#222;color:#111}.side{position:absolute;inset:0;padding:24px;display:grid;align-content:center;gap:12px}.broken{background:#ddd;color:#111;transform:rotate(-1deg) scale(1.04);filter:blur(.5px)}.fixed{width:var(--split);overflow:hidden;white-space:nowrap;background:#fff;color:#080808}.broken h2{text-decoration:line-through;color:#777}.mock-button{width:max-content;background:#080808;color:white;border:0;padding:10px 14px;border-radius:4px}.broken .mock-button{position:relative;left:78%;top:-26px;background:#777}.compare input{position:absolute;z-index:2;inset:auto 0 12px;width:100%;accent-color:#080808;cursor:ew-resize}.caption{color:#bbb;font-size:14px}:focus-visible{outline:2px solid #fff;outline-offset:3px}</style></head>
<body><div class="bar"><span data-ru="Демо для портфолио · учебный макет, не реальный клиентский проект." data-en="Portfolio demo · a mockup, not real client work."></span> · <a href="../../" data-ru="← к портфолио" data-en="← back to portfolio"></a></div><main class="wrap"><button id="lang" type="button">RU</button><h1 data-ru="Исправление секции сайта" data-en="A website section fixed"></h1><p class="caption" data-ru="Передвиньте ползунок, чтобы сравнить сломанную и исправленную версии." data-en="Move the slider to compare the broken and fixed versions."></p><div class="compare" data-compare><section class="side broken"><h2 data-ru="Загрузка..." data-en="Loading..."></h2><p data-ru="Текст вылезает за границы · кнопка смещена" data-en="Text overflows · button is misplaced"></p><button class="mock-button" data-ru="Подробнее" data-en="Learn more"></button></section><section class="side fixed"><h2 data-ru="Всё на своих местах" data-en="Everything in place"></h2><p data-ru="Адаптивная вёрстка и чёткий призыв к действию" data-en="Responsive layout and a clear call to action"></p><button class="mock-button" data-ru="Связаться" data-en="Contact"></button></section><input type="range" min="0" max="100" value="52" aria-label="Before and after comparison"></div></main><script src="../../lang.js"></script></body></html>
