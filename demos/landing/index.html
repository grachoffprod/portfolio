<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-ru="DEMO — Кофейня «Зерно»" data-en="DEMO — Zerno Coffee">DEMO — Zerno Coffee</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;color:#f2f3f5;background:#090b10}
.bar{background:#ffe58a;color:#171207;text-align:center;padding:8px;font-size:14px;font-weight:700}.bar a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px}
h1{font-size:clamp(30px,6vw,50px);line-height:1.1;margin:24px 0 10px}
p{color:#b4bac5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.c,form{background:#12151c;border-radius:12px;padding:16px;border:1px solid #2b313c}
form{border-radius:14px;padding:20px;display:grid;gap:12px;max-width:460px}
input,select,textarea{font:inherit;padding:10px;border:1px solid #555e6c;border-radius:8px;width:100%;background:#090b10;color:#f2f3f5}
button{font:inherit;font-weight:700;background:#a3ffbf;color:#071009;border:0;border-radius:8px;padding:12px;cursor:pointer}
.err{color:#ffadb8;font-size:14px;min-height:1em}
.tg{display:none;background:#12151c;border:1px solid #2b313c;border-radius:12px;padding:14px;max-width:460px;margin-top:14px;white-space:pre-line;font-size:15px}
.tg b{display:block;color:#a3ffbf;margin-bottom:4px}
#lang{float:right;border:1px solid #555e6c;color:#f2f3f5;background:#12151c;border-radius:6px;padding:3px 9px;cursor:pointer}
:focus-visible{outline:2px solid #a3ffbf;outline-offset:3px}
</style>
</head>
<body>
<div class="bar"><span data-ru="Демонстрационный проект из портфолио Yakov. Кофейня вымышленная." data-en="Demo project from Yakov's portfolio. The coffee shop is fictional."></span> <a href="../../" data-ru="← к портфолио" data-en="← back to portfolio"></a></div>
<div class="wrap">
  <button id="lang">RU</button>
  <h1 data-ru="Кофейня «Зерно» — кофе с собой и завтраки весь день" data-en="Zerno Coffee — coffee to go and all-day breakfast"></h1>
  <p data-ru="Обжариваем сами. Бронь столика и кейтеринг для офисов — оставьте заявку, перезвоним за 10 минут." data-en="We roast our own beans. Table booking and office catering — leave a request, we'll call back in 10 minutes."></p>
  <div class="grid">
    <div class="c"><b data-ru="Свежая обжарка" data-en="Fresh roast"></b><p data-ru="Каждую неделю — новые зёрна." data-en="New beans every week."></p></div>
    <div class="c"><b data-ru="Завтраки до 16:00" data-en="Breakfast till 4 pm"></b><p data-ru="Сырники, омлеты, гранола." data-en="Pancakes, omelettes, granola."></p></div>
    <div class="c"><b data-ru="Кейтеринг" data-en="Catering"></b><p data-ru="Кофе-брейк для офиса от 10 человек." data-en="Office coffee breaks from 10 people."></p></div>
  </div>
  <h2 data-ru="Оставить заявку" data-en="Leave a request"></h2>
  <form id="f" novalidate>
    <input name="name" data-ru="Ваше имя" data-en="Your name">
    <input name="phone" data-ru="Телефон, например +1 555 000 0000" data-en="Phone, e.g. +1 555 000 0000">
    <select name="type"><option value="table" data-ru="Столик" data-en="Table">Table</option><option value="catering" data-ru="Кейтеринг" data-en="Catering">Catering</option></select>
    <textarea name="comment" rows="3" data-ru="Комментарий (необязательно)" data-en="Comment (optional)"></textarea>
    <div class="err" id="err"></div>
    <button data-ru="Отправить заявку" data-en="Send request">Send request</button>
  </form>
  <div class="tg" id="tg"></div>
</div>
<script src="../../lang.js"></script>
<script>
// Set WORKER_URL to your Cloudflare Worker (see worker/telegram-worker.js) to send real messages.
// Empty = demo mode: the page only shows what would arrive in Telegram.
var WORKER_URL = '';
var T = {
  ru:{name:'Введите имя',phone:'Введите телефон (не меньше 7 цифр)',ok:'Заявка отправлена в Telegram',demo:'Демо-режим: так заявка выглядела бы в Telegram',fail:'Не удалось отправить, попробуйте позже'},
  en:{name:'Enter your name',phone:'Enter a phone number (7+ digits)',ok:'Request sent to Telegram',demo:'Demo mode: this is how the request would look in Telegram',fail:'Could not send, please try later'}
};
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var lang = currentLang(), t = T[lang], d = Object.fromEntries(new FormData(this)), err = document.getElementById('err');
  d.name = d.name.trim();
  if (!d.name) return err.textContent = t.name;
  if ((d.phone.match(/\d/g) || []).length < 7) return err.textContent = t.phone;
  err.textContent = '';
  var text = lang === 'ru'
    ? '🆕 Новая заявка\nИмя: ' + d.name + '\nТелефон: ' + d.phone + '\nТип: ' + (d.type === 'table' ? 'Столик' : 'Кейтеринг') + (d.comment ? '\nКомментарий: ' + d.comment : '')
    : '🆕 New request\nName: ' + d.name + '\nPhone: ' + d.phone + '\nType: ' + d.type + (d.comment ? '\nComment: ' + d.comment : '');
  var box = document.getElementById('tg'), head = t.demo;
  if (WORKER_URL) {
    try { var r = await fetch(WORKER_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)}); head = r.ok ? t.ok : t.fail; }
    catch (_) { head = t.fail; }
  }
  box.style.display = 'block';
  box.innerHTML = '';
  var b = document.createElement('b'); b.textContent = head; box.append(b, text);
  this.reset();
});
</script>
</body>
</html>
